<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI_CONTEXT</title>
  <desc id="desc">Repository-native shared memory for AI agents and humans</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152f"/>
      <stop offset="0.55" stop-color="#071c3b"/>
      <stop offset="1" stop-color="#10123b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d9ff"/>
      <stop offset="1" stop-color="#8a63ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#5676d7" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="22" fill="url(#dots)" opacity="0.45"/>
  <rect x="1" y="1" width="1278" height="638" rx="21" fill="none" stroke="#28406f" opacity="0.65"/>

  <text x="58" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" fill="#ffffff">AI_Context</text>
  <text x="60" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#aebfe1">Repository-native shared memory</text>
  <text x="60" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#aebfe1">for AI agents &amp; humans</text>
  <rect x="60" y="212" width="152" height="3" rx="2" fill="url(#accent)"/>

  <!-- repository tree -->
  <rect x="58" y="258" width="284" height="318" rx="18" fill="#08162e" stroke="#30476f" stroke-width="2"/>
  <text x="84" y="302" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" fill="#52c8ff">▣ repo/</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#dfe9ff">
    <text x="100" y="344">├─ 📁 docs/</text>
    <text x="120" y="378">├─ AI_CONTEXT.md</text>
    <text x="120" y="412">├─ decisions/</text>
    <text x="120" y="446">└─ sessions/</text>
    <text x="100" y="490">├─ AGENTS.md</text>
    <text x="100" y="524">├─ CLAUDE.md</text>
    <text x="100" y="558">└─ GEMINI.md</text>
  </g>

  <!-- repo folder -->
  <path d="M392 322h86l19 22h118v112H392z" fill="#0d4e8a" stroke="#47bcff" stroke-width="2"/>
  <path d="M392 344h223v112H392z" fill="#0b579d" opacity="0.9"/>
  <text x="452" y="404" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="36" fill="#87dbff">&lt;/&gt;</text>
  <text x="443" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#ffffff">Repository</text>
  <line x1="615" y1="400" x2="678" y2="400" stroke="#42c7ff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="678" cy="400" r="6" fill="#53d7ff"/>

  <!-- shared context -->
  <rect x="678" y="256" width="360" height="286" rx="20" fill="#0a1d3d" stroke="url(#accent)" stroke-width="2"/>
  <text x="804" y="301" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700" fill="#71d7ff">AI_CONTEXT</text>
  <line x1="718" y1="326" x2="998" y2="326" stroke="#315e9d" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="706" y="354" width="92" height="116" rx="12" fill="#0b2948" stroke="#35cfee"/>
    <text x="752" y="394" font-size="28" fill="#5fe1ff">▤</text>
    <text x="752" y="430" font-size="16" fill="#ffffff">Current</text>
    <text x="752" y="451" font-size="16" fill="#ffffff">State</text>

    <rect x="812" y="354" width="92" height="116" rx="12" fill="#211c4c" stroke="#8b6aff"/>
    <text x="858" y="394" font-size="28" fill="#a58bff">⚖</text>
    <text x="858" y="440" font-size="16" fill="#ffffff">Decisions</text>

    <rect x="918" y="354" width="92" height="116" rx="12" fill="#10294f" stroke="#549dff"/>
    <text x="964" y="394" font-size="28" fill="#73b5ff">▣</text>
    <text x="964" y="440" font-size="16" fill="#ffffff">Sessions</text>
  </g>
  <text x="858" y="512" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2" fill="#7a9eea">SHARED • VERSIONED • DURABLE</text>

  <!-- consumers -->
  <g fill="none" stroke-width="3">
    <path d="M1038 400 C1086 400 1086 295 1125 295" stroke="#4ad9ff"/>
    <path d="M1038 400 C1086 400 1086 370 1125 370" stroke="#8e6cff"/>
    <path d="M1038 400 C1086 400 1086 445 1125 445" stroke="#5ba9ff"/>
    <path d="M1038 400 C1086 400 1086 520 1125 520" stroke="#649cff"/>
  </g>
  <circle cx="1038" cy="400" r="6" fill="#57cbff"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#ffffff">
    <circle cx="1147" cy="295" r="27" fill="#102c4b" stroke="#4ad9ff" stroke-width="2"/>
    <text x="1134" y="302" font-size="20" fill="#66dcff">◆</text><text x="1182" y="301">AI Agent</text>
    <circle cx="1147" cy="370" r="27" fill="#211b4d" stroke="#8e6cff" stroke-width="2"/>
    <text x="1136" y="377" font-size="20" fill="#a98cff">●</text><text x="1182" y="376">AI Agent</text>
    <circle cx="1147" cy="445" r="27" fill="#122a50" stroke="#5ba9ff" stroke-width="2"/>
    <text x="1135" y="452" font-size="20" fill="#7fbcff">■</text><text x="1182" y="451">AI Agent</text>
    <circle cx="1147" cy="520" r="27" fill="#142a4b" stroke="#649cff" stroke-width="2"/>
    <text x="1136" y="527" font-size="20" fill="#89b9ff">●</text><text x="1182" y="516">Human /</text><text x="1182" y="537">Developer</text>
  </g>

  <path d="M0 590 C260 548 456 632 706 590 C930 552 1080 572 1280 540 L1280 640 L0 640 Z" fill="#102b67" opacity="0.22"/>
  <path d="M0 608 C260 566 456 650 706 608 C930 570 1080 590 1280 558" fill="none" stroke="#376cff" opacity="0.25" stroke-width="2"/>
</svg>
