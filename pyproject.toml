[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context"
version = "0.1.0"
description = "Repository-native shared memory scaffolding for AI-assisted projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "yoliverasPozo" }
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
ai-context = "ai_context.cli:main"

[project.urls]
Homepage = "https://github.com/yoliverasPozo/AI_CONTEXT"
Repository = "https://github.com/yoliverasPozo/AI_CONTEXT"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_context = ["resources/*.md"]
